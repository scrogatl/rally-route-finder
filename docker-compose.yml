# The web app, and optionally a guest copy of it to share. Neither does
# HTTPS: put a tunnel in front (e.g. a Cloudflare Tunnel, which serves them
# over HTTPS with its own certificate). Settings go in a .env file next to
# this one:
#   APP_PASSWORD=the-site-password
# and, only on a private site, to check routes on real roads with Google
# (every check is billed to the key's Google account):
#   GOOGLE_CHECK=on
#   GMAPS_API_KEY=your-google-maps-key
# and, to monitor it with New Relic APM and Browser:
#   NEW_RELIC_LICENSE_KEY=your-ingest-license-key
#   NEW_RELIC_APP_NAME=Rally Route Finder
# and, for a second site to share with others (the guest service below):
#   COMPOSE_PROFILES=guest
#   GUEST_PASSWORD=the-guest-site-password
services:
  # Your site, on port 80 of this machine
  app:
    build: .
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      GOOGLE_CHECK: ${GOOGLE_CHECK:-off}
      GMAPS_API_KEY: ${GMAPS_API_KEY:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-Rally Route Finder}
    ports:
      - "80:8000"
    volumes:
      - ./data:/data:ro
      - results:/results
    restart: unless-stopped

  # A second copy of the app to share with others, on port 8000: its own
  # password and its own saved runs, so theirs never mix with yours, and no
  # Google checks, so nobody else spends your key. It reads the same bonus
  # files. Planning uses at most 4 cores, leaving the rest for your runs.
  # Runs only with the guest profile (COMPOSE_PROFILES=guest in .env)
  guest:
    build: .
    profiles: [guest]
    environment:
      # Empty stops it at start-up with "set APP_PASSWORD"; set GUEST_PASSWORD
      APP_PASSWORD: ${GUEST_PASSWORD:-}
      GOOGLE_CHECK: "off"
      PLANNER_WORKERS: 4
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-Rally Route Finder} (guests)
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - guest_results:/results
    restart: unless-stopped

volumes:
  results:
  guest_results:
